# Weekly dependency notifications. Compatibility-boundary changes remain a
# deliberate human review, and Dependabot preserves the bounded NuGet float.

version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      b44-packages:
        patterns:
          - "B44.Standards"
      testing:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
